<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎼</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harmonia: Opus of the Ensemble</title>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <!-- Floating Action Toolbar -->
    <div class="floating-toolbar">
      <button id="btn-practice" class="tool-btn" title="Practice your instrument">🎹 [P] Practice Shed</button>
      <button id="btn-repertoire" class="tool-btn" title="View sheet music repertoire">📜 [R] Repertoire</button>
      <button id="btn-ensemble" class="tool-btn" title="Inspect ensemble members">🐾 [E] Ensemble</button>
      <button id="btn-quests" class="tool-btn" title="View Active Quests and Scores">🗺️ [Q] Quests</button>
      <button id="btn-dex" class="tool-btn" title="Open HarmoniDex Bestiary">📖 [H] HarmoniDex</button>
      <button id="btn-badges" class="tool-btn" title="View Conservatory Badges">🏆 [B] Badges</button>
    </div>

    <!-- Repertoire Sheet Music Modal -->
    <div id="modal-repertoire" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title">📜 Sheet Music Repertoire Binder</div>
          <button id="btn-close-repertoire" class="btn-close">&times;</button>
        </div>
        <div id="repertoire-list" class="modal-body">
          <!-- Populated by ui.ts -->
        </div>
      </div>
    </div>

    <!-- Ensemble Roster Modal -->
    <div id="modal-ensemble" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title">🐾 Ensemble Roster & Familiars</div>
          <button id="btn-close-ensemble" class="btn-close">&times;</button>
        </div>
        <div id="ensemble-roster-list" class="modal-body">
          <!-- Populated by ui.ts -->
        </div>
      </div>
    </div>

    <!-- Quests Journal Modal -->
    <div id="modal-quests" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title">🗺️ Sonora Quest Journal & Lost Scores</div>
          <button id="btn-close-quests" class="btn-close">&times;</button>
        </div>
        <div id="quests-list" class="modal-body">
          <!-- Populated by ui.ts -->
        </div>
      </div>
    </div>

    <!-- HarmoniDex Modal -->
    <div id="modal-dex" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title">📖 Sonora HarmoniDex (Creature Bestiary)</div>
          <button id="btn-close-dex" class="btn-close">&times;</button>
        </div>
        <div id="dex-list" class="modal-body">
          <!-- Populated by ui.ts -->
        </div>
      </div>
    </div>

    <!-- Clef Badges Modal -->
    <div id="modal-badges" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title">🏆 Regional Conservatory Clef Badges</div>
          <button id="btn-close-badges" class="btn-close">&times;</button>
        </div>
        <div id="badges-list" class="modal-body">
          <!-- Populated by ui.ts -->
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASTRAL STREAM: The Frequency Chronicles</title>
  <link rel="stylesheet" href="./src/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Top Bar: Streamer Header & Queue -->
    <header id="top-bar">
      <div class="brand">
        <span class="logo-icon">📻</span>
        <div>
          <h1>ASTRAL STREAM</h1>
          <div class="subtitle">✨ THE FREQUENCY CHRONICLES ✨</div>
        </div>
      </div>

      <!-- Now Playing Stream Queue -->
      <div id="stream-queue" class="stream-queue-container">
        <!-- Dynamically injected stream badges -->
      </div>
    </header>

    <!-- Main Game Viewport -->
    <main id="workspace">
      <div id="canvas-container">
        <canvas id="game-canvas"></canvas>

        <!-- Floating Tuning Panel -->
        <div id="tuning-panel" class="overlay-panel hidden">
          <div class="panel-header">🎛️ ASTRAL FREQUENCY TUNER</div>
          <div class="freq-readout">
            <div>TARGET: <span id="target-freq-display" class="highlight-cyan">98.0 FM</span></div>
            <div>CURRENT: <span id="current-freq-display" class="highlight-pink">85.0 FM</span></div>
          </div>
          <div class="tuning-buttons">
            <button id="tune-down-btn" class="tune-btn">◀◀ -2.0</button>
            <button id="tune-fine-down-btn" class="tune-btn">◀ -0.5</button>
            <button id="tune-fine-up-btn" class="tune-btn">+0.5 ▶</button>
            <button id="tune-up-btn" class="tune-btn">+2.0 ▶▶</button>
          </div>
          <div class="tuning-hint">👉 Align the frequencies until the waveforms lock and glow!</div>
        </div>

        <!-- Floating Battle Control Panel -->
        <div id="battle-panel" class="overlay-panel hidden">
          <div class="battle-hud">
            <!-- Player Stats -->
            <div class="fighter-card player-card">
              <div id="player-name" class="fighter-name">Chime-Cat</div>
              <div class="meter-bar"><div id="player-hp-bar" class="meter-fill hp-fill"></div></div>
              <div id="player-hp-text" class="meter-text">65/65 HP</div>
            </div>

            <div class="vs-badge">VS</div>

            <!-- Enemy Stats -->
            <div class="fighter-card enemy-card">
              <div id="enemy-name" class="fighter-name">Bass-Hound</div>
              <div class="meter-bar"><div id="enemy-hp-bar" class="meter-fill enemy-hp-fill"></div></div>
              <div id="enemy-hp-text" class="meter-text">85/85 HP</div>
            </div>
          </div>

          <!-- Fusion Button -->
          <button id="battle-fuse-btn" class="fusion-btn hidden">
            🌟 DUAL-STREAM FUSION MASHUP! 🌟
          </button>

          <!-- Attack Moves -->
          <div id="battle-moves" class="moves-grid">
            <!-- Injected move buttons -->
          </div>
        </div>

        <!-- Floating Story Dialogue Box -->
        <div id="dialogue-box" class="dialogue-card hidden">
          <div id="dialogue-avatar" class="dialogue-avatar">📻</div>
          <div class="dialogue-content">
            <div id="dialogue-speaker" class="dialogue-speaker">Speaker</div>
            <div id="dialogue-text" class="dialogue-text">Dialogue text goes here...</div>
            <div class="dialogue-prompt">▶ Click or Press Space to Continue</div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
